<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grafo de edificios</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-indigo-700 text-white py-5 shadow">
    <div class="max-w-5xl mx-auto px-4">
      <h1 class="text-2xl font-bold">Edificios y conexiones</h1>
      <p class="text-indigo-200 text-sm">Grafo no dirigido · BFS (ruta) · DFS (recorrido)</p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 grid gap-6 md:grid-cols-2">
    <!-- Agregar conexión -->
    <section class="bg-white rounded-xl shadow p-5">
      <h2 class="font-semibold text-lg mb-3">Agregar edificio / conexión</h2>
      <input id="con-origen" placeholder="Edificio origen" class="w-full border rounded px-3 py-2 mb-2">
      <input id="con-destino" placeholder="Edificio destino (vacío = solo crear edificio)" class="w-full border rounded px-3 py-2 mb-3">
      <button id="btn-conexion" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded">Agregar</button>
      <p id="msg-conexion" class="text-sm mt-3"></p>
    </section>

    <!-- Lista de adyacencia -->
    <section class="bg-white rounded-xl shadow p-5">
      <h2 class="font-semibold text-lg mb-3">Lista de adyacencia</h2>
      <ul id="lista" class="space-y-1 text-sm font-mono"></ul>
    </section>

    <!-- BFS -->
    <section class="bg-white rounded-xl shadow p-5">
      <h2 class="font-semibold text-lg mb-3">Ruta (BFS)</h2>
      <div class="flex gap-2 mb-3">
        <select id="ruta-origen" class="flex-1 border rounded px-3 py-2"></select>
        <select id="ruta-destino" class="flex-1 border rounded px-3 py-2"></select>
      </div>
      <button id="btn-ruta" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded">Calcular ruta</button>
      <div id="res-ruta" class="mt-3 text-sm"></div>
    </section>

    <!-- DFS -->
    <section class="bg-white rounded-xl shadow p-5">
      <h2 class="font-semibold text-lg mb-3">Recorrido (DFS)</h2>
      <select id="dfs-inicio" class="w-full border rounded px-3 py-2 mb-3"></select>
      <button id="btn-dfs" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded">Recorrer</button>
      <div id="res-dfs" class="mt-3 text-sm"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
